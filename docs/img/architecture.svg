    .built { fill: #1a1e27; stroke: #e3a43c; }
    .future { stroke: #6f7686; }
    .ink { fill: #e4e6ec; } .dim { fill: #9aa0ad; } .acc { fill: #e3a43c; } .head { fill: #9aa0ad; }
    .rule { stroke: #2a2f3a; }
    .chip { fill: #12151c; stroke: #343a48; }
    .arrow { stroke: #e3a43c; } .tip { fill: #e3a43c; }
