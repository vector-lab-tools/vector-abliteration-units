<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1290 560" width="1290" height="560" role="img" aria-labelledby="t d">
<title id="t">The architecture of Vector Abliteration Units</title>
<desc id="d">A unit file (its manifest and functions) is found and checked by the registry, run by a host that says what it offers in its capabilities, and reaches the model through an adapter that maps the sites onto one architecture. The adapter for language models is built, in the package; adapters for diffusion and audio models are future work. Beneath, the UnitContext through which a unit asks its host for places to act.</desc>
